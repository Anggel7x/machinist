[server]
listen = "127.0.0.1:7331"
database = "~/.machinist/server/machinist.db"
worker_token_file = "~/.machinist/server/worker.token"
# max_concurrent_jobs = 1

[commands.foreman]
executor = "codex"
prompt_file = "prompts/foreman.md"
timeout = "120m"

[commands.audit]
executor = "codex"
prompt_file = "prompts/audit.md"
timeout = "60m"

[commands.shepherd]
executor = "codex"
prompt_file = "prompts/shepherd.md"
timeout = "120m"

# Register each repository the control plane knows about. `slug` is where it
# lives on GitHub; `parallel` is its ceiling — how many of its runs may be in
# flight at once, across every host. Add one with:
#   machinist repo add owner/my-project --parallel 3
# [repositories.my-project]
# slug = "owner/my-project"
# parallel = 3

# Schedule Shepherd for one configured repository with a trigger like this:
# (the older [github.repositories] name-to-slug map is still read)
# [github.repositories]
# my-project = "owner/my-project"
#
# [triggers.cron.shepherd-my-project]
# schedule = "*/30 * * * *"
# timezone = "UTC"
# repository = "my-project"
# command = "shepherd"
# prompt = "Run the Shepherd queue for my-project with max_actions=3. Perform at most 3 mutating actions in this run."
