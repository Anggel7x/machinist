# Machine-local paths only. Commands and script workflows belong in config.toml.
# name is optional and defaults to the machine hostname.
data_directory = "~/.machinist/worker"

# How many workers this machine will run at once. This is the only number a
# host declares: how much parallelism a repository deserves is policy, and
# lives in config.toml as that repository's `parallel`. Each worker gets its
# own Git worktree, so they never share an index.
# max_workers = 2

# Which repositories this machine takes work for. "registered" (the default)
# takes every repository the control plane registers, cloning each on first
# dispatch; "listed" takes only the [repositories] entries below.
# serve_repositories = "listed"

[control_plane]
url = "http://127.0.0.1:7331"
token_file = "~/.machinist/server/worker.token"

[executors.codex]
command = ["codex", "exec", "--json", "--model={{machinist.model}}", "--sandbox", "danger-full-access", "-"]
models = { luna = "gpt-5.6-luna", terra = "gpt-5.6-terra", sol = "gpt-5.6-sol" }

[executors.claude]
command = ["claude", "--print", "--verbose", "--output-format", "stream-json", "--model={{machinist.model}}", "--dangerously-skip-permissions"]
models = { haiku = "haiku", sonnet = "sonnet", opus = "opus" }

# Point a repository at an existing checkout on this machine; `path` always wins
# over a clone. With serve_repositories = "listed", an entry with no path means
# this host serves that repository and clones it on first dispatch.
# [repositories.my-project]
# path = "/absolute/path/to/my-project"
